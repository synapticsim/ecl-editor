name: 🚀 Build & deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v2
        uses: actions/checkout@v7

      - name: Checkout v1
        uses: actions/checkout@v7
        with:
          ref: v1
          path: .v1

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            .v1/package-lock.json

      - name: Set up Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build v2
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: |
          npm ci
          npm run build

      - name: Build v1
        working-directory: .v1
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/v1/
        run: |
          npm ci
          npm run build
          mv dist "$GITHUB_WORKSPACE/dist/v1"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
